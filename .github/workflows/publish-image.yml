# ─────────────────────────────────────────────────────────────────────────────
# Publish Container Image to GitHub Container Registry (GHCR)
#
# Runs when:
#   - A tag matching 'v*' (e.g. v0.1.0) is pushed to the repository.
#   - Manually triggered via workflow_dispatch in the GitHub Actions UI.
#
# Target registry:
#   ghcr.io/jalau-capstones/qatu-client
#
# Required repository settings:
#   Settings → Actions → General → Workflow permissions = "Read and write"
#   (needed for GITHUB_TOKEN to push packages to ghcr.io).
#
# Build arguments:
#   VITE_API_BASE_URL=/v1
#   The client is a Single Page Application (SPA). At build time, Vite bakes
#   this base URL into the client bundle. In production, requests to /v1/*
#   are same-origin calls to the client's nginx, which reverse-proxies them
#   to http://api:3000 over the shared Docker network (qatu-net).
# ─────────────────────────────────────────────────────────────────────────────

name: Publish Container Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v0.1.0). For workflow_dispatch without a real git tag, use manual-<short-sha>.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push to GHCR (multi-arch)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: ${TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jalau-capstones/qatu-client
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Qatu Client
            org.opencontainers.image.description=Single Page Application for Qatu Marketplace
            org.opencontainers.image.url=https://gitlab.com/jala-university1/cohort-5/ES.CSSD-245.GA.T2.26.M2/SD/group-b/grupo-2/client
            org.opencontainers.image.source=https://github.com/JalaU-Capstones/qatu-client

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_API_BASE_URL=/v1
          tags: |
            ghcr.io/jalau-capstones/qatu-client:${{ steps.tag.outputs.value }}
            ghcr.io/jalau-capstones/qatu-client:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Summary
        run: |
          echo "### 📦 Published to GHCR" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`ghcr.io/jalau-capstones/qatu-client\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/jalau-capstones/qatu-client:${{ steps.tag.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/jalau-capstones/qatu-client:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
