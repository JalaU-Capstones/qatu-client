<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 142 40" fill="none" class="q-brand-logo-svg">
  <style>
    svg { color: #171717; }
    @media (prefers-color-scheme: dark) {
      svg { color: #f8f6ff; }
    }
  </style>
  <defs>
    <clipPath id="qatu-logo-clip">
      <rect x="1" y="1" width="38" height="38" rx="10" />
