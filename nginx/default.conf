server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver — defers upstream DNS resolution to
    # request time so nginx starts even when `api` is not yet reachable.
    # 127.0.0.11 is the well-known Docker embedded DNS address (constant
    # across all Docker networks). valid=5s caps the TTL so service
    # restarts are reflected quickly. (Deviation from static proxy_pass —
    # will be documented in ADR-016 § Implementation Status in Phase 4.)
    resolver 127.0.0.11 valid=5s;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /v1 reverse proxy — proxies to the api service on qatu-net.
    # The upstream is stored in a variable so nginx defers DNS resolution
    # to request time (requires `resolver` above). Without the variable,
    # nginx would resolve the hostname at config-parse time and fail to
    # start if `api` is not yet in DNS.
    location /v1/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;   # ADR-012 HttpOnly cookies
    }
}
