# ─────────────────────────────────────────────────────────────────────────────
# Qatu Client — Edge load balancer
#
# HTTP (:80)  → 301 redirect to HTTPS (:443), EXCEPT /healthz (for the
#               container healthcheck which uses HTTP).
# HTTPS (:443) → TLS termination → proxies to client:8080 on front-end.
#
# Host port mapping (docker-compose.yml):
#   ${CLIENT_PORT:-8080}  → :80  (HTTP)
#   ${CLIENT_HTTPS_PORT:-8443} → :443 (HTTPS)
#
# The self-signed cert is loaded from /etc/nginx/certs/{server.crt,server.key},
# bind-mounted from ./nginx/certs (see docker-compose.yml lb.volumes).
# Generate with: ./scripts/generate-dev-certs.sh
# See .docs/SSL.md for the full SSL story (generation, IP change, browser
# trust, prod migration, rotation).
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP server: redirect to HTTPS (except /healthz) ───────────────────────
server {
    listen 80;
    server_name _;

    # /healthz stays available on HTTP with 200 (the docker healthcheck
    # uses http://127.0.0.1:80/healthz; redirecting it would break the
    # healthcheck).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Everything else: permanent redirect to HTTPS.
    # The port 8443 is hardcoded because this config is static (mounted :ro).
    # For real prod (default 443), use `return 301 https://$host$request_uri;`
    # (no port). Documented in .docs/SSL.md.
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# ── HTTPS server: TLS termination + proxy to client:8080 ───────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # Certificates — bind-mounted read-only from ./nginx/certs
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS hardening — TLS 1.2 and 1.3 only.
    # Note: ssl_ciphers HIGH:!aNULL:!MD5 is a lab-adequate suite; for prod,
    # prefer Mozilla's recommended list (documented in .docs/SSL.md).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — instruct browsers to use HTTPS for 1 year.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Docker embedded DNS (defer client:8080 resolution to request time).
    resolver 127.0.0.11 valid=5s;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        set $client_upstream http://client:8080;
        proxy_pass $client_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
