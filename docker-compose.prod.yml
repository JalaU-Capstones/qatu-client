# ─────────────────────────────────────────────────────────────────────────────
# Qatu Client — Docker Compose PROD override
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Pulls the pre-built runtime image validated by CI/CD Quality Gates from
# the GitLab Container Registry (no local build).
#
# Traffic flow:
#   Host:${CLIENT_PORT:-8080} -> lb:80 (front-end) -> client:8080 (front-end + qatu-net)
#   /v1/* is reverse-proxied by client to api:3000 via qatu-net.
# ─────────────────────────────────────────────────────────────────────────────

services:
  client:
    image: registry.gitlab.com/jala-university1/cohort-5/es.cssd-245.ga.t2.26.m2/sd/group-b/grupo-2/client:latest
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  lb:
    restart: unless-stopped
    ports:
      - '${CLIENT_PORT:-8080}:80'
    depends_on:
      client:
        condition: service_healthy
