# ─────────────────────────────────────────────────────────────────────────────
# Qatu Client — Docker Compose PROD override
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Traffic flow:
#   Host:${CLIENT_PORT:-8080} -> lb:80 (front-end) -> client:8080 (front-end + qatu-net)
#   /v1/* is reverse-proxied by client to api:3000 via qatu-net.
# ─────────────────────────────────────────────────────────────────────────────

services:
  client:
    build:
      context: .
      target: runtime
      args:
        VITE_API_BASE_URL: /v1
    image: qatu-client:prod
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  lb:
    restart: unless-stopped
    ports:
      - '${CLIENT_PORT:-8080}:80'
    depends_on:
      client:
        condition: service_healthy
