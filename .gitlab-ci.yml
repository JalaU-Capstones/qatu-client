image: node:26

stages:
  - compile
  - build
  - test
  - coverage
  - sonarqube-check
  - sonarqube-quality-gate
  - build-image
  - push-image

variables:
  PNPM_CACHE_FOLDER: '$CI_PROJECT_DIR/.pnpm-store'

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

before_script:
  - npm install -g pnpm@11
  - pnpm config set store-dir $PNPM_CACHE_FOLDER
  - pnpm install --frozen-lockfile

compile:
  stage: compile
  script:
    - pnpm run lint
    - pnpm run format:check
    - pnpm audit --prod

build:
  stage: build
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist/

test:
  stage: test
  script:
    - apt-get update && apt-get install -y chromium
    - export CHROME_BIN=/usr/bin/chromium
    - pnpm run test

coverage:
  stage: coverage
  script:
    - apt-get update && apt-get install -y chromium
    - export CHROME_BIN=/usr/bin/chromium
    - pnpm run test:coverage
  artifacts:
    paths:
      - coverage/lcov.info
    expire_in: 1 hour

sonarqube-check:
  stage: sonarqube-check
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: ['']
  before_script: []
  needs:
    - job: coverage
      artifacts: true
  script:
    - sonar-scanner
      -Dsonar.projectKey=qatu-client
      -Dsonar.sources=src
      -Dsonar.tests=src
      -Dsonar.test.inclusions=**/*.spec.js
      -Dsonar.exclusions=**/*.spec.js,src/testing/**
      -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.token=$SONAR_TOKEN

sonarqube-quality-gate:
  stage: sonarqube-quality-gate
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: ['']
  before_script: []
  needs:
    - job: sonarqube-check
  script:
    - sonar-scanner
      -Dsonar.projectKey=qatu-client
      -Dsonar.sources=src
      -Dsonar.tests=src
      -Dsonar.test.inclusions=**/*.spec.js
      -Dsonar.exclusions=**/*.spec.js,src/testing/**
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true

build-image:
  stage: build-image
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_HOST: 'tcp://docker:2376'
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: '$DOCKER_TLS_CERTDIR/client'
  before_script: []
  needs:
    - job: build
      artifacts: true
    - job: sonarqube-quality-gate
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - docker build
      --target runtime
      --build-arg VITE_API_BASE_URL=/v1
      --tag "$CI_REGISTRY_IMAGE:ci-$CI_COMMIT_SHORT_SHA"
      .

push-image:
  stage: push-image
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_HOST: 'tcp://docker:2376'
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: '$DOCKER_TLS_CERTDIR/client'
  before_script: []
  needs:
    - job: build-image
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build
      --target runtime
      --build-arg VITE_API_BASE_URL=/v1
      --tag "$CI_REGISTRY_IMAGE:DEV-$VERSION"
      --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      --tag "$CI_REGISTRY_IMAGE:latest"
      .
    - docker push "$CI_REGISTRY_IMAGE:DEV-$VERSION"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
