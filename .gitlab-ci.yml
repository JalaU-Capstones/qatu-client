image: node:26

stages:
  - helloworld
  - lint
  - test
  - build
  - security
  - publish

variables:
  PNPM_CACHE_FOLDER: '$CI_PROJECT_DIR/.pnpm-store'

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

before_script:
  - npm install -g pnpm@11
  - pnpm config set store-dir $PNPM_CACHE_FOLDER
  - pnpm install --frozen-lockfile

helloworld:
  stage: helloworld
  before_script: []
  script:
    - echo "Hello World"
  only:
    - main
    - develop
    - merge_requests

lint:
  stage: lint
  script:
    - pnpm run lint
    - pnpm run format:check

test:
  stage: test
  script:
    - apt-get update && apt-get install -y chromium
    - export CHROME_BIN=/usr/bin/chromium
    - pnpm run test

build:
  stage: build
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist/

security:
  stage: security
  script:
    # Audit production dependencies (fails on any vulnerability).
    # Dev-only packages like deepmerge (via style-dictionary) have no upstream patch yet;
    # they are excluded here because --prod skips devDependencies.
    - pnpm audit --prod
    # Full audit for awareness (allowed to fail on unfixable dev-only advisories).
    - pnpm audit || true

publish:image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_HOST: 'tcp://docker:2376'
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: '$DOCKER_TLS_CERTDIR/client'
  before_script: [] # override global pnpm install
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  needs: ['lint', 'test', 'build', 'security']
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build
      --target runtime
      --build-arg VITE_API_BASE_URL=/v1
      --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      --tag "$CI_REGISTRY_IMAGE:latest"
      .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
