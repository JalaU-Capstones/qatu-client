image: node:26

stages:
  - lint
  - test
  - build
  - security

variables:
  PNPM_CACHE_FOLDER: '$CI_PROJECT_DIR/.pnpm-store'

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

before_script:
  - npm install -g pnpm@11
  - pnpm config set store-dir $PNPM_CACHE_FOLDER
  - pnpm install --frozen-lockfile

lint:
  stage: lint
  script:
    - pnpm run lint
    - pnpm run format:check

test:
  stage: test
  script:
    - apt-get update && apt-get install -y chromium
    - export CHROME_BIN=/usr/bin/chromium
    - pnpm run test

build:
  stage: build
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist/

security:
  stage: security
  script:
    - pnpm audit
