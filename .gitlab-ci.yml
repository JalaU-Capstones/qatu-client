image: node:26

stages:
  - helloworld
  - lint
  - test
  - build
  - security

variables:
  PNPM_CACHE_FOLDER: '$CI_PROJECT_DIR/.pnpm-store'

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

before_script:
  - npm install -g pnpm@11
  - pnpm config set store-dir $PNPM_CACHE_FOLDER
  - pnpm install --frozen-lockfile

helloworld:
  stage: helloworld
  before_script: []
  script:
    - echo "Hello World"
  only:
    - main
    - develop
    - merge_requests

lint:
  stage: lint
  script:
    - pnpm run lint
    - pnpm run format:check

test:
  stage: test
  script:
    - apt-get update && apt-get install -y chromium
    - export CHROME_BIN=/usr/bin/chromium
    - pnpm run test

build:
  stage: build
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist/

security:
  stage: security
  script:
    # Audit production dependencies (fails on any vulnerability).
    # Dev-only packages like deepmerge (via style-dictionary) have no upstream patch yet;
    # they are excluded here because --prod skips devDependencies.
    - pnpm audit --prod
    # Full audit for awareness (allowed to fail on unfixable dev-only advisories).
    - pnpm audit || true
